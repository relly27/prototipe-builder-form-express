<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Constructor de Formularios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
  <h1 class="mb-4 text-center">Constructor de Formularios</h1>

  <!-- Sección crear formulario -->
  <div class="card mb-4">
    <div class="card-header">Crear Formulario</div>
    <div class="card-body">
      <form id="createForm">
        <div class="mb-3">
          <label class="form-label">Nombre del formulario</label>
          <input type="text" id="formName" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Descripción</label>
          <textarea id="formDescription" class="form-control"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Definición de campos (JSON)</label>
          <textarea id="formSchema" class="form-control" rows="5" required>
{
  "fields": [
    { "name": "cliente", "label": "Cliente", "type": "text", "required": true },
    { "name": "monto", "label": "Monto", "type": "number", "required": true },
    { "name": "fecha", "label": "Fecha", "type": "date", "required": true }
  ]
}
          </textarea>
        </div>
        <button type="submit" class="btn btn-primary">Crear</button>
      </form>
    </div>
  </div>

  <!-- Sección listar formularios -->
  <div class="card mb-4">
    <div class="card-header">Formularios Disponibles</div>
    <div class="card-body">
      <ul id="formList" class="list-group"></ul>
    </div>
  </div>

  <!-- Sección para renderizar formulario dinámico -->
  <div class="card mb-4">
    <div class="card-header">Formulario Seleccionado</div>
    <div class="card-body">
      <h5 id="selectedFormName"></h5>
      <form id="dynamicForm"></form>
    </div>
  </div>

  <!-- Sección para mostrar registros -->
  <div class="card">
    <div class="card-header">Registros del Formulario</div>
    <div class="card-body">
      <table class="table table-striped">
        <thead>
          <tr id="recordsHeader"></tr>
        </thead>
        <tbody id="recordsTable"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
